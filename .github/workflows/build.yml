name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25 for Gradle Bootstrapping
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Download LibGui
        run: |
          mkdir -p libs
          curl -L "https://github.com/CottonMC/LibGui/releases/download/17.0.0/LibGui-17.0.0+26.2.jar" \
            -o libs/LibGui-17.0.0+26.2.jar

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build with Gradle
        run: gradle build

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
